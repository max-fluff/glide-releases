<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2438"/>
      <stop offset="1" stop-color="#121624"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B5BDB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3B5BDB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scrim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#161b2b" stop-opacity="0.95"/>
      <stop offset="0.65" stop-color="#161b2b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#161b2b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="958" height="258" rx="24"/></clipPath>
  </defs>

  <rect x="1" y="1" width="958" height="258" rx="24" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.07"/>

  <g clip-path="url(#card)">
    <!-- faint keycaps along the top and bottom -->
    <g fill="none" stroke="#9fb3f0" stroke-opacity="0.13" stroke-width="1.5">
      <rect x="34" y="14" width="56" height="34" rx="8"/>
      <rect x="100" y="14" width="56" height="34" rx="8"/>
      <rect x="166" y="14" width="56" height="34" rx="8"/>
      <rect x="232" y="14" width="150" height="34" rx="8"/>
      <rect x="392" y="14" width="56" height="34" rx="8"/>
      <rect x="458" y="14" width="56" height="34" rx="8"/>
      <rect x="524" y="14" width="76" height="34" rx="8"/>
      <rect x="20" y="214" width="76" height="34" rx="8"/>
      <rect x="106" y="214" width="56" height="34" rx="8"/>
      <rect x="172" y="214" width="56" height="34" rx="8"/>
      <rect x="238" y="214" width="56" height="34" rx="8"/>
      <rect x="304" y="214" width="56" height="34" rx="8"/>
      <rect x="370" y="214" width="76" height="34" rx="8"/>
      <rect x="456" y="214" width="56" height="34" rx="8"/>
      <rect x="522" y="214" width="56" height="34" rx="8"/>
    </g>
    <g fill="#9fb3f0" fill-opacity="0.16" font-size="13" font-weight="500" text-anchor="middle">
      <text x="62" y="36">Ctrl</text>
      <text x="128" y="36">Alt</text>
      <text x="194" y="36">Cmd</text>
      <text x="420" y="36">C</text>
      <text x="486" y="36">V</text>
      <text x="562" y="36">Shift</text>
      <text x="58" y="236">Option</text>
      <text x="134" y="236">Esc</text>
      <text x="200" y="236">Tab</text>
      <text x="266" y="236">Win</text>
      <text x="332" y="236">Fn</text>
      <text x="408" y="236">Enter</text>
      <text x="484" y="236">Z</text>
      <text x="550" y="236">X</text>
    </g>

    <ellipse cx="760" cy="130" rx="230" ry="140" fill="url(#glow)"/>
  </g>

  <!-- keep the wordmark clear of the keycaps -->
  <ellipse cx="290" cy="130" rx="320" ry="84" fill="url(#scrim)"/>

  <text x="60" y="118" font-size="64" font-weight="700" fill="#f3f5fa" letter-spacing="-1">glide</text>
  <text x="62" y="160" font-size="23" fill="#b9c2db">One mouse, keyboard and clipboard</text>
  <text x="62" y="190" font-size="23" fill="#b9c2db">for Mac and Windows.</text>

  <!-- the Mac: a laptop -->
  <rect x="604" y="86" width="136" height="88" rx="10" fill="#4A5B85"/>
  <rect x="612" y="94" width="120" height="72" rx="5" fill="#3d4c72"/>
  <path d="M590 176 H754 L748 186 Q747 188 744 188 H600 Q597 188 596 186 Z" fill="#5b6c98"/>

  <!-- the PC: a monitor on a stand -->
  <rect x="774" y="64" width="152" height="104" rx="10" fill="#3B5BDB"/>
  <rect x="782" y="72" width="136" height="88" rx="5" fill="#3350c6"/>
  <rect x="841" y="168" width="18" height="18" fill="#2c45aa"/>
  <rect x="816" y="186" width="68" height="8" rx="4" fill="#2c45aa"/>

  <!-- the cursor's path from one screen to the other -->
  <path d="M640 146 C 700 60, 780 196, 862 112" fill="none" stroke="#F07A3A" stroke-width="8" stroke-linecap="round"/>
  <circle cx="640" cy="146" r="6" fill="#F07A3A"/>
  <circle cx="862" cy="112" r="13" fill="#F07A3A" stroke="#ffffff" stroke-width="4"/>
</svg>
